[project]
name = "legiones-cannenses"
version = "0.0.0"
description = "Legiones Cannenses (L.C.) — the synthetic middle layer of Project Cannae Legion"
authors = [{name = "Guillermo Ravelo"}]
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]
# COP-0 (Common Operating Picture) program picture (cop/). Not needed by `lc`, which keeps
# zero runtime dependencies. Install with: pip install -e ".[cop,dev]"
cop = [
    "Flask>=3.0,<4.0",
    "gunicorn>=22.0",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0",
    "pydantic>=2.6,<3.0",
    "cannae-kernel @ git+https://github.com/br-collab/cannae-kernel.git@v1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lc*", "cop*"]

[tool.setuptools.package-data]
cop = ["program.yaml", "templates/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests compare against literal expected values (status codes, counts) by design.
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true

# cannae-kernel ships py.typed (since v0.1.1), so strict mypy reads its annotations directly.
# The follow_untyped_imports override it needed before is deleted.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"

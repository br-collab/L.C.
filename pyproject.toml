[project]
name = "legiones-cannenses"
version = "0.0.0"
description = "Legiones Cannenses (L.C.) — the synthetic middle layer of Project Cannae Legion"
authors = [{name = "Guillermo Ravelo"}]
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]
# Thifur-C2, the command and control harness (harness_c2/). It needs the frozen
# contracts and nothing else — no web stack, no HTTP client, no database driver. Kept
# separate from `cop` so that stays true and is provable: the CI job that runs the
# harness installs only this, so a C2 that grew a dependency on the web surface would
# fail there rather than pass because `cop` happened to bring it along.
harness = [
    "pydantic>=2.6,<3.0",
    "cannae-kernel @ git+https://github.com/br-collab/cannae-kernel.git@v1.0.0",
]
# Thifur-H, the adaptive intelligence class (thifur_h/). Phase C.
#
# Its own extra, for the reason the harness has its own: **model work will bring heavy
# dependencies** (AMD2 §2), and the day it does, the lean job must still prove `lc` needs
# nothing and the harness job must still prove Thifur-C2 needs only the kernel. An extra
# that shared those would make both claims untestable the moment a tensor library landed.
#
# Today it is the kernel and pydantic, because condition A is deterministic and needs no
# model at all. That is the point of building the baseline first, and this list growing is
# how a reader will know conditions B, C and D arrived.
h = [
    "pydantic>=2.6,<3.0",
    "cannae-kernel @ git+https://github.com/br-collab/cannae-kernel.git@v1.1.0",
]
# COP-0 (Common Operating Picture) program picture (cop/). Not needed by `lc`, which keeps
# zero runtime dependencies. Install with: pip install -e ".[cop,dev]"
cop = [
    "Flask>=3.0,<4.0",
    "gunicorn>=22.0",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0",
    "pydantic>=2.6,<3.0",
    "cannae-kernel @ git+https://github.com/br-collab/cannae-kernel.git@v1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lc*", "cop*", "harness_c2*", "thifur_h*"]

[tool.setuptools.package-data]
cop = ["program.yaml", "templates/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests compare against literal expected values (status codes, counts) by design.
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true

# cannae-kernel ships py.typed (since v0.1.1), so strict mypy reads its annotations directly.
# The follow_untyped_imports override it needed before is deleted.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"

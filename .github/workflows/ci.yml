# Continuous integration: lint, strict type check and tests on Python 3.11.
#
# The import-boundary test (JUM-D-06) runs here from the first commit, so the
# rule that `lc` never imports the harness, the emulators or `cop` is checked on
# every push rather than remembered.
#
# Three jobs, and the split is the point: each proves what a package actually needs.
# - `check` installs only the `dev` extra and checks `lc`. It proves `lc` still needs no
#   runtime dependency at all. The COP-0 tests (tests/cop) and the harness tests
#   (tests/harness_c2) both need dependencies, so they are left to the jobs below.
# - `harness` installs only `harness` and `dev`: the frozen contracts and pydantic. It
#   proves Thifur-C2 needs the kernel and nothing else — no web stack, no HTTP client,
#   no database driver. A C2 that grew one fails here rather than passing because the
#   `cop` extra happened to bring it along.
# - `thifur-h` installs only `h` and `dev`. Today that is the kernel and pydantic,
#   because condition A is deterministic. When conditions B, C and D bring a model
#   and its dependencies, this job is where that weight lands and the other two
#   still prove what they prove.
# - `cop` installs `cop` and `dev` and runs everything: ruff, ruff format, strict mypy
#   over every package, and the whole test suite. COP_EXTRA_REQUIRED=1 turns the skip of
#   the cop import-boundary probe into a failure.

name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Filtering on `branches: [main]` meant a
  # pull request based on another branch — a stacked one, say — got no checks at all:
  # not a failure and no red mark, simply nothing to see. #7 was merged that way.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      # uv.lock and pyproject.toml must agree. Nothing compared them until now:
      # the `harness` extra was added in 3947575 and the lock was not
      # regenerated, so `main` carried a lock that did not match its own
      # manifest and every run stayed green, because nothing checked.
      #
      # cannae-kernel and Project-Atreides get this from `uv sync --locked`, and
      # aureon from `scripts/compile_lock.py --check`. This repository installs
      # with pip, so the check is its own step rather than a side effect of the
      # install.
      #
      # `uv lock --check` resolves metadata and installs nothing, so it does not
      # weaken what this job exists to prove: that `lc` needs no runtime
      # dependency. It runs first so a drifted lock fails in seconds.
      - name: Lock matches pyproject
        run: uv lock --check

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: >-
          mypy lc tests --exclude tests/cop --exclude tests/harness_c2
          --exclude tests/thifur_h

      - name: pytest
        run: pytest -q --ignore=tests/cop --ignore=tests/harness_c2 --ignore=tests/thifur_h

  harness:
    name: Thifur-C2 harness (kernel only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[harness,dev]"

      - name: mypy
        run: mypy harness_c2 tests/harness_c2

      - name: pytest
        env:
          HARNESS_EXTRA_REQUIRED: "1"
        run: pytest -q tests/harness_c2 tests/test_import_boundaries.py

  thifur-h:
    name: Thifur-H (kernel only, for now)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[h,dev]"

      - name: mypy
        run: mypy thifur_h tests/thifur_h

      - name: pytest
        env:
          H_EXTRA_REQUIRED: "1"
        run: pytest -q tests/thifur_h tests/test_import_boundaries.py

  cop:
    name: COP-0 program picture (cop extra)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cop,dev]"

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: mypy lc cop harness_c2 thifur_h tests

      - name: pytest
        env:
          COP_EXTRA_REQUIRED: "1"
          HARNESS_EXTRA_REQUIRED: "1"
          H_EXTRA_REQUIRED: "1"
        run: pytest -q

# Continuous integration: lint, strict type check and tests on Python 3.11.
#
# The import-boundary test (JUM-D-06) runs here from the first commit, so the
# rule that `lc` never imports the harness, the emulators or `cop` is checked on
# every push rather than remembered.
#
# Three jobs, and the split is the point: each proves what a package actually needs.
# - `check` installs the middle layer and the `dev` extra and checks `lc`. Its only
#   runtime dependencies at M2 are Pydantic and the frozen kernel contracts. The COP-0 tests
#   (tests/cop) and the harness tests
#   (tests/harness_c2) both need dependencies, so they are left to the jobs below.
# - `harness` installs only `harness` and `dev`: the frozen contracts and pydantic. It
#   proves Thifur-C2 needs the kernel and nothing else — no web stack, no HTTP client,
#   no database driver. A C2 that grew one fails here rather than passing because the
#   `cop` extra happened to bring it along.
# - `thifur-h` installs only `h` and `dev`. Today that is the kernel and pydantic,
#   because condition A is deterministic. When conditions B, C and D bring a model
#   and its dependencies, this job is where that weight lands and the other two
#   still prove what they prove.
# - `cop` installs `cop` and `dev` and runs everything: ruff, ruff format, strict mypy
#   over every package, and the whole test suite. COP_EXTRA_REQUIRED=1 turns the skip of
#   the cop import-boundary probe into a failure.

name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Filtering on `branches: [main]` meant a
  # pull request based on another branch — a stacked one, say — got no checks at all:
  # not a failure and no red mark, simply nothing to see. #7 was merged that way.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # uv.lock and pyproject.toml must agree. Nothing compared them until now:
      # the `harness` extra was added in 3947575 and the lock was not
      # regenerated, so `main` carried a lock that did not match its own
      # manifest and every run stayed green, because nothing checked.
      #
      # cannae-kernel and Project-Atreides get this from `uv sync --locked`, and
      # aureon from `scripts/compile_lock.py --check`. This repository installs
      # with pip, so the check is its own step rather than a side effect of the
      # install.
      #
      # `uv lock --check` resolves metadata and installs nothing, so it does not
      # weaken what this job exists to prove: that `lc` has only its declared
      # dependencies. It runs first so a drifted lock fails in seconds.
      - name: Lock matches pyproject
        run: uv lock --check

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: >-
          mypy lc tests --exclude tests/cop --exclude tests/harness_c2
          --exclude tests/thifur_h --exclude tests/test_atreides_handoff.py
          --exclude tests/test_aureon_intent_wire.py --exclude tests/slice1

      - name: pytest
        run: >-
          pytest -q --ignore=tests/cop --ignore=tests/harness_c2 --ignore=tests/thifur_h
          --ignore=tests/test_atreides_handoff.py --ignore=tests/slice1

  atreides-handoff:
    name: Atreides handoff (pinned real predicates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the ancestry-verified Atreides boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: br-collab/Project-Atreides
          ref: d36c0c23289ea06176e4f12780d36a407f77e01b
          path: .handoff/Project-Atreides

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install L.C. and the pinned test boundary
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --no-deps -e .handoff/Project-Atreides

      - name: Type check the production handoff and its contract test
        env:
          MYPYPATH: .handoff/Project-Atreides
        run: mypy lc tests/test_atreides_handoff.py

      - name: Exercise the real Atreides predicates
        env:
          HANDOFF_EXTRA_REQUIRED: "1"
        run: pytest -q tests/test_atreides_handoff.py

  aureon-intent:
    name: Aureon intent (pinned real producer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the ancestry-verified Aureon producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: br-collab/aureon
          # Ancestry verified against aureon/main after PR #56 deployed.
          ref: 3e90f72a1ffa177045d4e4f3e7f9770689e037f1
          path: .handoff/aureon

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install L.C.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Exercise Aureon's real approved-intent bytes
        env:
          AUREON_WIRE_REQUIRED: "1"
          PYTHONPATH: .handoff/aureon
        run: pytest -q tests/test_aureon_intent_wire.py

      - name: Type check the producer boundary
        env:
          MYPYPATH: .handoff/aureon
        run: mypy lc tests/test_aureon_intent_wire.py

  slice1:
    name: Wave 5 slice 1 (pinned domains)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out ancestry-verified Aureon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: br-collab/aureon
          # Ancestry verified after #56 deployed.
          ref: 3e90f72a1ffa177045d4e4f3e7f9770689e037f1
          path: .slice1/aureon

      - name: Check out ancestry-verified Atreides
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: br-collab/Project-Atreides
          # Ancestry verified against Project-Atreides main.
          ref: 7929b84d4b68c42ed857de42c40e64a9bb48b8a6
          path: .slice1/Project-Atreides

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install L.C. and pinned domain dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cop,dev]"
          pip install --no-deps -e .slice1/Project-Atreides

      - name: Run the end-to-end slice
        env:
          PYTHONPATH: .slice1/aureon
        run: pytest -q tests/slice1

      - name: Type check the end-to-end slice
        env:
          MYPYPATH: .slice1/aureon:.slice1/Project-Atreides
        run: mypy lc emulators harness_c2 tests/slice1

      - name: Publish successful lifecycle documents
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/publish-lifecycle-document
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  harness:
    name: Thifur-C2 harness (kernel only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[harness,dev]"

      - name: mypy
        run: mypy harness_c2 tests/harness_c2

      - name: pytest
        env:
          HARNESS_EXTRA_REQUIRED: "1"
        run: pytest -q tests/harness_c2 tests/test_import_boundaries.py

  thifur-h:
    name: Thifur-H (kernel only, for now)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[h,dev]"

      - name: mypy
        run: mypy thifur_h tests/thifur_h

      - name: pytest
        env:
          H_EXTRA_REQUIRED: "1"
        run: pytest -q tests/thifur_h tests/test_import_boundaries.py

  cop:
    name: COP-0 program picture (cop extra)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cop,dev]"

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: >-
          mypy lc cop harness_c2 thifur_h tests
          --exclude tests/test_atreides_handoff.py
          --exclude tests/test_aureon_intent_wire.py --exclude tests/slice1

      - name: pytest
        env:
          COP_EXTRA_REQUIRED: "1"
          HARNESS_EXTRA_REQUIRED: "1"
          H_EXTRA_REQUIRED: "1"
        run: pytest -q --ignore=tests/slice1

# Continuous integration: lint, strict type check and tests on Python 3.11.
#
# The import-boundary test (JUM-D-06) runs here from the first commit, so the
# rule that `lc` never imports the harness, the emulators or `cop` is checked on
# every push rather than remembered.
#
# Two jobs:
# - `check` installs only the `dev` extra, as before, and checks `lc`. It proves `lc`
#   still needs no runtime dependency. The COP-0 tests (tests/cop) need the `cop` extra
#   and are left to the second job.
# - `cop` installs the `cop` and `dev` extras and runs everything: ruff, strict mypy
#   over `lc`, `cop` and `tests`, and the whole test suite. COP_EXTRA_REQUIRED=1 turns
#   the skip of the cop import-boundary probe into a failure.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy lc tests --exclude tests/cop

      - name: pytest
        run: pytest -q --ignore=tests/cop

  cop:
    name: COP-0 program picture (cop extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cop,dev]"

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: mypy lc cop tests

      - name: pytest
        env:
          COP_EXTRA_REQUIRED: "1"
        run: pytest -q
